name: zovv
description: "ZOVV mobile application."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.13.7

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.3
  video_player: ^2.10.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Android-only, pinned adaptation: bounded media cache and load-control policy.
dependency_overrides:
  video_player_android:
    path: packages/video_player_android

flutter:
  uses-material-design: true
  assets:
    - assets/posters/
