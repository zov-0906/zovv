name: iOS unsigned IPA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      GATEWAY_TOKEN: ${{ secrets.ZOVV_GATEWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Dependencies
        run: |
          flutter config --enable-swift-package-manager
          flutter pub get
      - name: Analyze and test
        run: |
          flutter analyze --no-pub lib test
          flutter test --no-pub
      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GATEWAY_TOKEN" ]]; then
            echo '::error::Configure the repository secret ZOVV_GATEWAY_TOKEN first.'
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          target = Path(os.environ['RUNNER_TEMP']) / 'zovv-defines.json'
          target.write_text(json.dumps({
            'ZOVV_GATEWAY': 'https://api.getagentconsole.space',
            'ZOVV_GATEWAY_TOKEN': os.environ['GATEWAY_TOKEN'],
          }))
          target.chmod(0o600)
          PY
          flutter build ios --release --no-codesign --no-pub \
            --build-number="${{ github.run_number }}" \
            --dart-define-from-file="$RUNNER_TEMP/zovv-defines.json"
      - name: Package IPA
        run: bash scripts/package-ios-unsigned.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ZOVV-iOS-unsigned-${{ github.run_number }}
          path: build/ios/unsigned/ZOVV-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Clean build parameters
        if: always()
        run: rm -f "$RUNNER_TEMP/zovv-defines.json"
