name: iOS TestFlight internal
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-testflight
  cancel-in-progress: false
jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Xcode version
        run: xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Dependencies and checks
        run: |
          flutter config --enable-swift-package-manager
          flutter pub get
          flutter analyze --no-pub lib test integration_test
          flutter test --no-pub
      - name: Verify iOS cache and app flows on simulator
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl create ZOVV-Cache-Smoke com.apple.CoreSimulator.SimDeviceType.iPhone-17)"
          trap 'xcrun simctl shutdown "$DEVICE_ID" || true; xcrun simctl delete "$DEVICE_ID" || true' EXIT
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          flutter test integration_test -d "$DEVICE_ID" --no-pub
      - name: Prepare private signing assets
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ZOVV_GATEWAY_TOKEN: ${{ secrets.ZOVV_GATEWAY_TOKEN }}
        run: python3 scripts/prepare-testflight.py
      - name: Build signed internal TestFlight IPA
        shell: bash
        run: |
          set -euo pipefail
          # Separate from old unsigned builds; reruns also get a new version.
          major=$((1000 + GITHUB_RUN_NUMBER))
          if (( major > 9999 || GITHUB_RUN_ATTEMPT > 99 )); then
            echo '::error::Update the build-number allocation before continuing.'
            exit 1
          fi
          BUILD_NUMBER="$major.$GITHUB_RUN_ATTEMPT"
          flutter build ipa --release --no-pub \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist="$RUNNER_TEMP/zovv-signing/ExportOptions.plist" \
            --dart-define-from-file="$RUNNER_TEMP/zovv-signing/defines.json"
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipas=(build/ios/ipa/*.ipa)
          if [[ ${#ipas[@]} -ne 1 ]]; then
            echo '::error::Expected exactly one signed IPA.'
            exit 1
          fi
          xcrun altool --upload-app --type ios --file "${ipas[0]}" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Store debug symbols
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ZOVV-iOS-symbols-${{ github.run_id }}
          path: build/ios/archive/Runner.xcarchive/dSYMs
          if-no-files-found: warn
          retention-days: 7
      - name: Remove private signing assets
        if: always()
        shell: bash
        run: |
          signing="$RUNNER_TEMP/zovv-signing"
          if [[ -f "$signing/installed-profile-path.txt" ]]; then
            profile="$(cat "$signing/installed-profile-path.txt")"
            rm -f "$profile"
          fi
          security delete-keychain "$signing/signing.keychain-db" 2>/dev/null || true
          rm -rf "$signing"
